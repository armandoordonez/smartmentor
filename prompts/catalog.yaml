# Catálogo de prompts de SmartMentor (fuente de verdad para ai/, C4 y AD2).
#
# Regla: cambiar el texto de un prompt obliga a crear <id>/v<n+1>.md, registrar su sha256 aquí y
# subir current_version. Los archivos de una versión publicada no se editan: la prueba
# ai/tests/contract/test_prompt_catalog.py compara cada sha256 con el archivo.
#
# Campos:
#   current_version  versión vigente (archivo <id>/v<versión>.md)
#   name_es          nombre visible en C4 y AD2
#   task             job_type o tarea de ai/ que usa el prompt (plan 5.4.3)
#   scope            alcance de la generación y de la caché
#   temperature      temperatura inicial (notebook v2, sección 3.2 del plan)
#   model_tier       default = AI_LLM_MODEL_DEFAULT; small = AI_LLM_MODEL_SMALL (plan 5.4.6)
#   output_schema    esquema de salida que se pasa al proveedor (prompts/schemas/...)
#   contract         contrato que ai/ entrega a la API (prompts/schemas/...)
#   screens          pantallas del prototipo v3 que muestran el resultado
#   versions         sha256 de cada archivo publicado

schema_version: v1
source_notebook: design/04-prueba-mago-de-oz/smartmentor_mago_de_oz_gemini_v2.ipynb

prompts:
  - id: syllabus_structuring
    current_version: 1
    name_es: Estructuración del syllabus
    task: syllabus.structure
    scope: por documento de syllabus (SHA-256 del texto)
    temperature: 0.1
    model_tier: default
    output_schema: llm/syllabus_llm.v1.json
    contract: syllabus.v1.json
    screens: [D1c, D2]
    versions:
      1: cb1a09b430e706ece71613c2077bd58ff13a1ffc3b548e7ee6ed384917a918a2

  - id: diagnostic_generation
    current_version: 1
