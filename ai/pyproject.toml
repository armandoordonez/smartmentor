[project]
name = "smartmentor-ai"
version = "0.1.0"
description = "Servicio de IA de SmartMentor: contratos, prompts, generación y evaluación"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
    "google-genai>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0",
]

# El servicio no es un paquete instalable: solo se resuelven sus dependencias.
[tool.uv]
package = false

[tool.ruff]
extend = "../ruff.toml"

[tool.ruff.lint]
# Las reglas comunes están en ../ruff.toml; aquí solo van las excepciones justificadas.

[tool.ruff.lint.per-file-ignores]
# Pruebas: `assert` es la forma de afirmar en pytest (S101); las fixtures se piden por su efecto
# o para sobrescribir una firma sin usar el valor (ARG001/ARG002); los valores de prueba son
# desechables y obvios, no secretos (S105/S106).
"tests/**" = ["S101", "ARG001", "ARG002", "S105", "S106"]
# Adaptadores PostgreSQL: las consultas interpolan solo constantes del módulo (lista de columnas y
# condiciones fijas); todo valor externo va como parámetro enlazado de SQLAlchemy.
"app/adapters/postgres/**" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: pruebas contra PostgreSQL (requieren AI_TEST_DATABASE_URL; se omiten sin ella)",
]
