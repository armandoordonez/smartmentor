# Entorno reproducible de SmartMentor.
# Uso: cp .env.example .env && scripts/gen-secrets.sh && docker compose up -d --build
# Servicios: postgres (PostgreSQL 17 + pgvector) -> liquibase (aplica el esquema y termina) -> api.
# keycloak (proveedor de identidad, sobre el mismo PostgreSQL): la API valida sus tokens y descarga sus llaves públicas por la red interna.
# app (interfaz en Streamlit): depende de api y keycloak.
#
# Perfiles opcionales (docker compose --profile <nombre> up -d):
#   ai    servicio de IA (ai) y su worker (ai-worker); misma imagen, construida desde ai/Dockerfile.
#   mail  Mailpit: buzón de desarrollo para los correos de Keycloak (verificación de registro). Ver keycloak/README.md.
#
# Credenciales: ninguna tiene valor por defecto. Toda credencial obligatoria usa ${VAR:?mensaje}: el compose se
# niega a arrancar y dice qué variable falta. Los puertos y las URL estructurales sí traen un valor por defecto.

name: smartmentor

# Entorno común de los dos procesos del servicio de IA (misma imagen): HTTP y worker.
x-ai-environment: &ai-environment
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TZ: ${TZ:-America/Bogota}
  DATABASE_HOST: ${DATABASE_HOST:-postgres}
  DATABASE_PORT: ${DATABASE_PORT:-5432}
  DATABASE_NAME: ${DATABASE_NAME:-smartmentor}
  AI_DATABASE_USER: ${AI_DATABASE_USER:?Define AI_DATABASE_USER en .env (ver .env.example)}
  AI_DATABASE_PASSWORD: ${AI_DATABASE_PASSWORD:?Define AI_DATABASE_PASSWORD en .env (ver .env.example)}
  # Validación de los tokens de la API (ADR 0014): mismas llaves que la API, audiencia propia.
  OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?Define OIDC_ISSUER_URL en .env (ver .env.example)}
  OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/smartmentor/protocol/openid-connect/certs}
  AI_SERVICE_AUDIENCE: ${AI_SERVICE_AUDIENCE:-smartmentor-ai}
  # Modelos y claves: sin valor por defecto en el código ni aquí. Vacío = /ready falla con un mensaje claro
  # (o se usa FakeLlmProvider en pruebas). La clave que importa es la del proveedor elegido.
  AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-}
  AI_LLM_MODEL_DEFAULT: ${AI_LLM_MODEL_DEFAULT:-}
  AI_LLM_MODEL_SMALL: ${AI_LLM_MODEL_SMALL:-}
  AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-}
  AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-}
  AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-}
  AI_COURSE_BUDGET_USD: ${AI_COURSE_BUDGET_USD:-}
  AI_ENROLLMENT_BUDGET_USD: ${AI_ENROLLMENT_BUDGET_USD:-}
  AI_EVAL_LIVE: ${AI_EVAL_LIVE:-0}

x-ai-service: &ai-service
  # Contexto en la raíz: la imagen copia prompts/ (fuente de verdad de prompts y esquemas) además de ai/.
  build:
    context: .
    dockerfile: ai/Dockerfile
  image: smartmentor-ai:0.1.0
  restart: unless-stopped
  profiles: [ai]
  depends_on:
    postgres:
      condition: service_healthy
    liquibase:
      condition: service_completed_successfully

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    container_name: smartmentor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartmentor}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env (ver .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (ver .env.example)}
      TZ: ${TZ:-America/Bogota}
      PGTZ: ${TZ:-America/Bogota}
      # Los lee 01-create-database.sql para crear la base y el rol de Keycloak
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?Define KEYCLOAK_DB_USER en .env (ver .env.example)}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Define KEYCLOAK_DB_PASSWORD en .env (ver .env.example)}
      # Usuarios de mínimo privilegio (ADR 0019): los crea el bootstrap de la base (solo con base vacía;
      # con un volumen existente, database/scripts/bootstrap.sh) y los usan Liquibase, api y ai.
      OWNER_DATABASE_USER: ${OWNER_DATABASE_USER:?Define OWNER_DATABASE_USER en .env (ver .env.example)}
      OWNER_DATABASE_PASSWORD: ${OWNER_DATABASE_PASSWORD:?Define OWNER_DATABASE_PASSWORD en .env (ver .env.example)}
      API_DATABASE_USER: ${API_DATABASE_USER:?Define API_DATABASE_USER en .env (ver .env.example)}
      API_DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:?Define API_DATABASE_PASSWORD en .env (ver .env.example)}
      AI_DATABASE_USER: ${AI_DATABASE_USER:?Define AI_DATABASE_USER en .env (ver .env.example)}
      AI_DATABASE_PASSWORD: ${AI_DATABASE_PASSWORD:?Define AI_DATABASE_PASSWORD en .env (ver .env.example)}
      # Usuario de solo lectura del notebook de métricas: opcional; el bootstrap no crea el rol sin contraseña.
      METRICS_DATABASE_USER: ${METRICS_DATABASE_USER:-smartmentor_metrics}
      METRICS_DATABASE_PASSWORD: ${METRICS_DATABASE_PASSWORD:-}
    command: ["postgres", "-c", "timezone=America/Bogota", "-c", "log_timezone=America/Bogota"]
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      # Datos dentro del proyecto (ignorados por git). Subcarpeta: initdb exige un directorio vacío.
      - ./database/data/postgres:/var/lib/postgresql/data
      # Respaldo de la creación de la base; solo corre si el directorio de datos está vacío.
      - ./database/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  liquibase:
    build:
      context: ./database/liquibase
    image: smartmentor-liquibase:5.0.4
    container_name: smartmentor-liquibase
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smartmentor}
      # Liquibase corre como smartmentor_owner: las tablas quedan a su nombre (ADR 0019).
      LIQUIBASE_COMMAND_USERNAME: ${OWNER_DATABASE_USER:?Define OWNER_DATABASE_USER en .env (ver .env.example)}
      LIQUIBASE_COMMAND_PASSWORD: ${OWNER_DATABASE_PASSWORD:?Define OWNER_DATABASE_PASSWORD en .env (ver .env.example)}
      # Correo del administrador sembrado; vacío = no se siembra ninguno.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.xml
      LIQUIBASE_LOG_LEVEL: info
    volumes:
      - ./database/liquibase/changelog:/liquibase/changelog:ro
    command: ["update"]

  api:
    build:
      context: ./api
    image: smartmentor-api:0.1.0
    container_name: smartmentor-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-smartmentor}
      # La API se conecta con su usuario de mínimo privilegio (ADR 0019); su configuración lo lee como DATABASE_*.
      DATABASE_USER: ${API_DATABASE_USER:?Define API_DATABASE_USER en .env (ver .env.example)}
      DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:?Define API_DATABASE_PASSWORD en .env (ver .env.example)}
      APP_CONTEXT_PROFILE: ${APP_CONTEXT_PROFILE:-generic}
      # Si es true, las rutas de instructor y admin exigen que el token indique un segundo factor (OTP).
      REQUIRE_SECOND_FACTOR: ${REQUIRE_SECOND_FACTOR:-false}
      # Keycloak: el emisor es la URL que ve el cliente; las llaves se descargan por la red interna.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?Define OIDC_ISSUER_URL en .env (ver .env.example)}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/smartmentor/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-smartmentor-api}
      # Cliente con el que Swagger UI (/docs) hace el login con usuario y contraseña. Vacío = desactivado.
      OIDC_DOCS_CLIENT_ID: ${OIDC_DOCS_CLIENT_ID-smartmentor-dev-tools}
      # Llamadas a ai/ con client credentials (ADR 0014). fake = FakeAiService; http = el servicio ai (perfil ai).
      # Los nombres de .env (AI_BASE_URL, AI_CLIENT_*) son los del Anexo D; la API los lee como AI_SERVICE_*.
      AI_SERVICE_MODE: ${AI_SERVICE_MODE:-fake}
      AI_SERVICE_URL: ${AI_BASE_URL:-http://ai:8030}
      AI_SERVICE_CLIENT_ID: ${AI_CLIENT_ID:-smartmentor-api-service}
      AI_SERVICE_CLIENT_SECRET: ${AI_CLIENT_SECRET:?Define AI_CLIENT_SECRET en .env (ver .env.example)}
      # El token se pide a Keycloak por la red interna (con KC_HOSTNAME_BACKCHANNEL_DYNAMIC el iss sigue siendo el público).
      AI_SERVICE_TOKEN_URL: ${AI_SERVICE_TOKEN_URL:-http://keycloak:8080/realms/smartmentor/protocol/openid-connect/token}
      AI_SERVICE_TIMEOUT_SECONDS: ${AI_SERVICE_TIMEOUT_SECONDS:-10}
      AI_SWEEP_INTERVAL_SECONDS: ${AI_SWEEP_INTERVAL_SECONDS:-60}
    ports:
      - "${API_PORT:-8020}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Servicio de IA (perfil ai). HTTP: contratos de docs/contracts/ai-service-v1.md. No se publica fuera de la
  # máquina: el puerto queda en 127.0.0.1 solo para depuración (ADR 0020: sin puerto público).
  ai:
    <<: *ai-service
    container_name: smartmentor-ai
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8030"]
    environment: *ai-environment
    ports:
      - "127.0.0.1:${AI_PORT:-8030}:8030"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8030/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Trabajos asíncronos de ai/ (tabla ai_jobs, ADR 0010). Misma imagen; no atiende HTTP, así que se
  # anula el HEALTHCHECK de la imagen (que consulta /health).
  ai-worker:
    <<: *ai-service
    container_name: smartmentor-ai-worker
    command: ["python", "-m", "app.worker"]
    environment: *ai-environment
    healthcheck:
      disable: true

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: smartmentor-keycloak
    restart: unless-stopped
    # start-dev: modo de desarrollo (HTTP). Sus datos están en el PostgreSQL del proyecto.
    # --import-realm: importa keycloak/realm/*.json solo si el realm todavía no existe; Keycloak sustituye
    # los marcadores ${VARIABLE} del archivo con las variables de este contenedor (secretos y correo).
    # Para producción se usa start con HTTPS (ver keycloak/README.md).
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Define KEYCLOAK_ADMIN en .env (ver .env.example)}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Define KEYCLOAK_ADMIN_PASSWORD en .env (ver .env.example)}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?Define KEYCLOAK_DB_USER en .env (ver .env.example)}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Define KEYCLOAK_DB_PASSWORD en .env (ver .env.example)}
      KC_HEALTH_ENABLED: "true"
      # URL pública (la del navegador y del campo iss de los tokens). Los puntos de acceso de servidor a
      # servidor (token, llaves) se resuelven con el host de la petición, así la API llega por keycloak:8080.
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:${KEYCLOAK_PORT:-8180}}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      TZ: ${TZ:-America/Bogota}
      # Valores que Keycloak sustituye en los marcadores ${...} del realm al importarlo. OJO: si faltara
      # alguno, Keycloak guardaría el marcador como texto literal; por eso los secretos son obligatorios.
      OIDC_UI_CLIENT_SECRET: ${OIDC_UI_CLIENT_SECRET:?Define OIDC_UI_CLIENT_SECRET en .env (ver .env.example)}
      AI_CLIENT_SECRET: ${AI_CLIENT_SECRET:?Define AI_CLIENT_SECRET en .env (ver .env.example)}
      SMTP_HOST: ${SMTP_HOST:?Define SMTP_HOST en .env (ver .env.example)}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?Define SMTP_FROM en .env (ver .env.example)}
      SMTP_FROM_DISPLAY_NAME: ${SMTP_FROM_DISPLAY_NAME:-SmartMentor}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      # Configuración del realm versionada en git (roles, clientes y mappers; sin usuarios, secretos ni llaves).
      - ./keycloak/realm:/opt/keycloak/data/import
    healthcheck:
      # La imagen no trae curl: se consulta el puerto de gestión (9000) con bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000;
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '"status": "UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  app:
    build:
      context: ./app
    image: smartmentor-app:0.1.0
    container_name: smartmentor-app
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      # api = API real con login de Keycloak; fixtures = JSON fijos sin login (se rechaza con APP_ENV=production).
      APP_DATA_SOURCE: ${APP_DATA_SOURCE:-api}
      APP_ENV: ${APP_ENV:-local}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      TZ: ${TZ:-America/Bogota}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:${APP_PORT:-8501}}
      APP_CONTEXT_PROFILE: ${APP_CONTEXT_PROFILE:-generic}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-}
      PILOT_WINDOW_TEXT: ${PILOT_WINDOW_TEXT:-}
      # La API por la red interna (puerto del contenedor, no el publicado en el anfitrión).
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      # Login OIDC con st.login (cliente confidencial smartmentor-ui). Solo se exigen con APP_DATA_SOURCE=api:
      # el compose no puede condicionarlo, así que van con :- y la app falla nombrando la variable que falte.
      OIDC_SERVER_METADATA_URL: ${OIDC_SERVER_METADATA_URL:-http://keycloak:8080/realms/smartmentor/.well-known/openid-configuration}
      OIDC_UI_CLIENT_ID: ${OIDC_UI_CLIENT_ID:-smartmentor-ui}
      OIDC_UI_CLIENT_SECRET: ${OIDC_UI_CLIENT_SECRET:-}
      APP_COOKIE_SECRET: ${APP_COOKIE_SECRET:-}
    ports:
      - "${APP_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Buzón de desarrollo (perfil mail): recibe los correos de Keycloak sin enviarlos. Con este perfil, en .env:
  # SMTP_HOST=mailpit, SMTP_PORT=1025, SMTP_STARTTLS=false, SMTP_USER y SMTP_PASSWORD con cualquier texto.
  mailpit:
    image: axllent/mailpit:v1.29.0
    container_name: smartmentor-mailpit
    restart: unless-stopped
    profiles: [mail]
    environment:
      # Acepta cualquier usuario y contraseña (el realm siempre autentica) y sin TLS: solo desarrollo.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      TZ: ${TZ:-America/Bogota}
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
